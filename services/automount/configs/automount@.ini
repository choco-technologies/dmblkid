; automount@.ini - libsystemd unit template, instantiated once per block node
; by the [class=block] rule in automount.rules.
;
; %i expands to the node's name (e.g. "dmsdio0_0p1"), %v to its absolute path
; (e.g. "/dev/dmsdio0/0p1"). A third argument would replace the base
; directory the volumes are mounted in (default /mnt).
;
; automount exits with 0 right away when there is nothing to mount (a
; partition table, unknown contents) and stays running while the volume is
; mounted; the removal of the node stops it, which unmounts the volume.
; type=oneshot only makes libsystemd log such a clean exit as information
; rather than a warning - stopping a running instance works the same.
;
; stop_timeout_ms: the unmount writes back what the file system still caches.
description=Automount for %i
exec=automount
args=%v %i
type=oneshot
restart=no
stop_timeout_ms=5000

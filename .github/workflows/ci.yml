name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build dmblkid
        run: |
          mkdir -p build
          cd build
          cmake .. -DDMOD_MODE=DMOD_MODULE
          cmake --build .

      - name: Verify module files
        run: |
          echo "Checking for module files..."
          ls -lh build/dmf/
          test -f build/dmf/dmblkid.dmf
          test -f build/dmf/dmblkid_version.txt
          test -f build/dmf/test_dmblkid.dmf
          test -f build/dmf/blkid.dmf
          test -f build/dmf/dmpart.dmf
          test -f build/dmf/test_dmpart.dmf
          test -f build/dmf/automount.dmf
          test -f build/dmf/libautomount.dmf
          test -f build/dmf/test_libautomount.dmf
          echo "Module files present"

      # dmblkid uses the 64-bit file API (Dmod_FileSeek/_FileTell/_FileSize
      # 2.0, dmod#312). The dmod_loader in the 1.0.4 image predates it, so
      # the tests run in one built from the same dmod develop the module
      # is built against. Cloned into a fresh directory: the image already
      # has a /tmp/dmod of its own.
      - name: Build dmod_loader from dmod develop
        run: |
          DMOD_SRC=$(mktemp -d)
          git clone --depth 1 -b develop https://github.com/choco-technologies/dmod.git "$DMOD_SRC"
          cmake -S "$DMOD_SRC" -B "$DMOD_SRC/build" -DDMOD_MODE=DMOD_SYSTEM \
            -DDMOD_BUILD_EXAMPLES=ON -DDMOD_BUILD_TESTS=OFF
          cmake --build "$DMOD_SRC/build" --target dmod_loader
          echo "DMOD_LOADER=$DMOD_SRC/build/examples/system/dmod_loader/dmod_loader" >> $GITHUB_ENV

      - name: Run tests with dmod_loader
        run: |
          export DMOD_DMF_DIR=$(pwd)/build/dmf
          dmf-get install -d ${DMOD_DMF_DIR}/test_dmpart-local.dmd -y
          ${DMOD_LOADER} build/dmf/test_dmpart.dmf
          dmf-get install -d ${DMOD_DMF_DIR}/test_dmblkid-local.dmd -y
          ${DMOD_LOADER} build/dmf/test_dmblkid.dmf
          dmf-get install -d ${DMOD_DMF_DIR}/test_libautomount-local.dmd -y
          ${DMOD_LOADER} build/dmf/test_libautomount.dmf

  build-targets:
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.0.4
    strategy:
      matrix:
        arch: [ armv7/cortex-m4, armv7/cortex-m7 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build dmblkid, dmpart and blkid
        run: |
          mkdir -p build
          cd build
          cmake .. -DDMOD_TOOLS_NAME=arch/${{ matrix.arch }}
          cmake --build . > build.log 2>&1 || { cat build.log; exit 1; }
          cat build.log
          if grep -E "warning:|error:" build.log | grep -v "build-id"; then
            echo "Compiler warnings found"
            exit 1
          fi
          test -f dmf/dmblkid.dmf
          test -f dmf/blkid.dmf
          test -f dmf/dmpart.dmf
          test -f dmf/automount.dmf
          test -f dmf/libautomount.dmf
